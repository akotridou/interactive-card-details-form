<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
   
  <title>Frontend Mentor | Interactive card details form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  
 <main>
  
  <div class="card-section">
    
    <div class="front-card">
      <img src="./images/card-logo.svg" alt="">
    <h1 id="card">0000 0000 0000 0000</h1>
    <p id="nameholder">Jane Appleseed</p>
    <p><span id="mmCard">00</span>/<span id="yyCard">00</span></p>
  </div>
    <div class="back-card"><p id="cvcCard">000</p></div>
  </div>
  <div class="form-section">
    <form>
         <label for="name">Cardholder Name</label>
         <input id="name" placeholder="e.g. Jane Appleseed">
         <p id="nameError"></p>

         <label for="num">Card Number</label>
         <input id="num" placeholder="e.g. 1234 5678 9123 0000" required>
         <p id="cardError"></p>
       
        <div class="datecvs">
          <label>Exp. Date (MM/YY)</label>
          <input id="mm" placeholder="MM" required>
          <p id="mmError"></p>
          <input id="yy" placeholder="YY" required>
          <p id="yyError"></p>

          <label for="cvc">CVC</label>
          <input id="cvc" placeholder="e.g. 123" required>
          <p id="cvcError"></p>
        </div>
        <button id="confirm">Confirm</button>
        
    </form>

    
    <div id="thankYou" class="thank-you">
    <h1>Thank you!</h1>
    <p>We've added your card details</p>
    <button id="continue">Continue</button>

  </div>
  </main>
  <!-- Completed state start -->

</div>
  <script src="script.js"></script>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Anthimi</a>.
  </footer>
</body>
</html>
