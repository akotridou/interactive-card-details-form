<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | Interactive card details form</title>
</head>

<body>

  <main>

    <div class="card-section">

      <div class="front-card">
        <img src="./images/card-logo.svg" alt="Card logo">

        <h1 id="card">0000 0000 0000 0000</h1>

        <p id="nameholder">Jane Appleseed</p>

        <p>
          <span id="mmCard">00</span>/<span id="yyCard">00</span>
        </p>
      </div>

      <div class="back-card">
        <p id="cvcCard">000</p>
      </div>

    </div>


    <div class="form-section">

      <form>

        <label for="name">Cardholder Name</label>
        <input
          id="name"
          type="text"
          placeholder="e.g. Jane Appleseed"
          autocomplete="cc-name"
        >
        <p id="nameError"></p>


        <label for="num">Card Number</label>
        <input
          id="num"
          type="text"
          placeholder="e.g. 1234 5678 9123 0000"
          inputmode="numeric"
          autocomplete="cc-number"
          maxlength="16"
        >
        <p id="cardError"></p>


        <div class="datecvs">

          <div class="expiry">
            <label>Exp. Date (MM/YY)</label>

            <div class="expiry-inputs">
              <div>
                <input
                  id="mm"
                  type="text"
                  placeholder="MM"
                  inputmode="numeric"
                  maxlength="2"
                  autocomplete="cc-exp-month"
                >
                <p id="mmError"></p>
              </div>

              <div>
                <input
                  id="yy"
                  type="text"
                  placeholder="YY"
                  inputmode="numeric"
                  maxlength="2"
                  autocomplete="cc-exp-year"
                >
                <p id="yyError"></p>
              </div>
            </div>
          </div>


          <div class="cvc-container">
            <label for="cvc">CVC</label>

            <input
              id="cvc"
              type="text"
              placeholder="e.g. 123"
              inputmode="numeric"
              maxlength="3"
              autocomplete="cc-csc"
            >

            <p id="cvcError"></p>
          </div>

        </div>


        <button id="confirm" type="submit">Confirm</button>

      </form>


      <div id="thankYou" class="thank-you">

        <h1>Thank you!</h1>

        <p>We've added your card details</p>

        <button id="continue" type="button">Continue</button>

      </div>

    </div>

  </main>


  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor
    </a>.
    Coded by
    <a href="#">
      Anthimi
    </a>.
  </footer>


  <script src="script.js"></script>

</body>
</html>
